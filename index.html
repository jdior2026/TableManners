<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Table Manners</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Shrikhand&display=swap">
<style>
/* Layout: a polka-dotted deep blue band up top, then one working surface at a time.
   The table always sits on white "paper" so it looks the way it will look in Word. */
:root {
  --bg: #F3FAF6; --dot: rgba(14,124,102,.07); --dot2: rgba(214,90,140,.05);
  --surface: #FFFFFF; --surface2: #E6F4EE; --line: #BFD8D1;
  --fg: #0B2447; --muted: #3F5870;
  --band: #0B2A5E; --band-fg: #F3FBF8; --band-dot: rgba(159,232,208,.17); --band-dot2: rgba(246,184,206,.20);
  --green: #0B6F5B; --green-hover: #085A49; --on-green: #FFFFFF; --mint: #BFE8D9;
  --blue: #123A80; --pink: #F6B8CE; --pink-soft: #FCE7EF; --pink-ink: #9A1F5B;
  --bad: #B3261E; --bad-bg: #FBE9E7; --warn: #7A4F00; --warn-bg: #FFF3D6; --info: #123A80; --info-bg: #E4ECFA; --ok: #0B6F5B; --ok-bg: #DDF3EA;
  --paper: #FFFFFF; --paper-ink: #111111; --paper-line: #D6DCE4;
  --display: "Shrikhand", Georgia, serif; --body: "Atkinson Hyperlegible", Verdana, "Segoe UI", sans-serif;
  --radius: 16px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background-color: var(--bg); color: var(--fg); font: 400 17px/1.55 var(--body);
  background-image: radial-gradient(var(--dot) 3px, transparent 3.5px), radial-gradient(var(--dot2) 3px, transparent 3.5px);
  background-size: 36px 36px; background-position: 0 0, 18px 18px; }
h1, h2, h3, p { margin: 0; }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.85rem; line-height: 1.2; color: var(--blue); text-wrap: balance; letter-spacing: .005em; }
h3 { font-size: 1.05rem; font-weight: 700; }
a { color: var(--green); }
:focus-visible { outline: 3px solid var(--pink-ink); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: no-preference) { .btn, .card-pick, .chip, .tab { transition: background-color .15s, border-color .15s, transform .15s; } }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1280px; margin-inline: auto; }

.band { background-color: var(--band); color: var(--band-fg); position: relative;
  background-image: radial-gradient(var(--band-dot) 5px, transparent 5.5px), radial-gradient(var(--band-dot2) 5px, transparent 5.5px);
  background-size: 34px 34px; background-position: 0 0, 17px 17px; padding-block: 18px 16px; }
.band::after { content: ""; position: absolute; left: 0; right: 0; bottom: -11px; height: 12px;
  background: radial-gradient(circle at 11px 0, var(--band) 11px, transparent 11.5px) repeat-x; background-size: 22px 12px; pointer-events: none; }
.band-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 2.15rem; line-height: 1.05; letter-spacing: .01em; }
.brand p { font-size: .95rem; opacity: .92; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { appearance: none; border: 2px solid transparent; background: transparent; color: var(--band-fg); font: 700 1rem var(--body); padding: 8px 16px; border-radius: 999px; cursor: pointer; }
.tab:hover { border-color: var(--mint); }
.tab[aria-current="page"] { background: var(--mint); color: #06281F; }
main { padding-block: 34px 56px; }
.foot { padding-block: 0 28px; color: var(--muted); font-size: .9rem; }

.btn { appearance: none; border: 2px solid var(--green); background: var(--green); color: var(--on-green); font: 700 1rem var(--body); padding: 10px 20px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn:hover { background: var(--green-hover); border-color: var(--green-hover); }
.btn.ghost { background: var(--surface); color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--green); background: var(--surface2); }
.btn.pink { background: var(--pink-soft); color: var(--pink-ink); border-color: var(--pink); }
.btn.pink:hover { background: var(--pink); color: #4A0E2C; }
.btn.small { padding: 5px 12px; font-size: .9rem; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: var(--surface); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--muted); }
.small-t { font-size: .92rem; }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 22px; min-width: 0; }

.steps { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 4px; margin: 0 0 24px; padding: 0; font-size: .93rem; }
.steps li { display: flex; align-items: center; gap: 7px; padding: 4px 12px 4px 5px; border-radius: 999px; color: var(--muted); }
.steps li b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); color: var(--fg); font-size: .85rem; }
.steps li.on { background: var(--surface); color: var(--fg); font-weight: 700; box-shadow: inset 0 0 0 2px var(--green); }
.steps li.on b { background: var(--green); color: var(--on-green); }
.steps li.done b { background: var(--mint); color: var(--fg); }
.steps li.done button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 7px; }
.steps li.done button:focus-visible { outline: 3px solid var(--pink-ink); }

.home { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }
.drop { border: 3px dashed var(--green); border-radius: 22px; padding: 36px 24px; text-align: center; background-color: var(--surface); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 280px; min-width: 0;
  background-image: radial-gradient(var(--dot) 7px, transparent 7.5px), radial-gradient(var(--dot2) 7px, transparent 7.5px); background-size: 44px 44px; background-position: 0 0, 22px 22px; }
.drop.over { background-color: var(--surface2); border-style: solid; }
.drop.compact { min-height: 170px; padding: 22px; }
.drop h2 { font-size: 2.1rem; }
.fmts { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; list-style: none; padding: 0; margin: 0; }
.fmts li { font-size: .84rem; padding: 2px 9px; border-radius: 999px; background: var(--surface2); color: var(--fg); }
.preview-pair { display: grid; gap: 12px; }
.tag { display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--pink-ink); }

.paperlet { background: var(--paper); color: var(--paper-ink); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--paper-line); overflow-x: auto; }
.paperlet table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.paperlet th, .paperlet td { padding: 3px 8px; text-align: center; font-weight: 400; white-space: nowrap; }
.paperlet .lft { text-align: left; }
.spss th, .spss td { border: 1px solid #9AA9B8; font-family: Arial, sans-serif; font-size: .8rem; }
.spss .shade { background: #DDE6EE; }
.apa { font-family: "Times New Roman", Times, serif; }
.apa table { border-top: 1.5px solid #000; border-bottom: 1.5px solid #000; font-size: .95rem; }
.apa thead tr:last-child th { border-bottom: 1.5px solid #000; }

.file-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 11px 14px; border-radius: 12px; background: var(--surface2); }
.file-row .nm { font-weight: 700; word-break: break-word; min-width: 0; }
.alert { padding: 11px 14px; border-radius: 12px; font-size: .96rem; }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.info { background: var(--info-bg); color: var(--info); }
.alert.ok { background: var(--ok-bg); color: var(--ok); }

.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); }
.card-pick { appearance: none; text-align: left; background: var(--surface); color: var(--fg); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px 18px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card-pick:hover { border-color: var(--green); }
.card-pick[aria-pressed="true"] { border-color: var(--green); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--green); }
.card-pick b { font-size: 1.1rem; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .lab { font-weight: 700; font-size: .96rem; }
.hint { font-size: .88rem; color: var(--muted); }
input[type=text], input[type=number], select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; width: 100%; max-width: 100%; }
input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { border-color: var(--green); outline: 2px solid var(--green); outline-offset: 0; }
textarea { min-height: 72px; resize: vertical; }
input[type=color] { width: 44px; height: 32px; padding: 2px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 14px; }
.nav-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { appearance: none; border: 2px solid var(--line); background: var(--surface); color: var(--fg); font: 400 .95rem var(--body); padding: 5px 13px; border-radius: 999px; cursor: pointer; max-width: 100%; text-align: left; }
.chip:hover { border-color: var(--green); }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); font-weight: 700; }
.chip[aria-pressed="false"] { text-decoration: line-through; color: var(--muted); }
.chip.ask { text-decoration: none; color: var(--fg); }

.tlist { display: grid; gap: 12px; }
.tcard { border: 2px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; min-width: 0; }
.tcard.sel { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.tcard-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 11px 14px; }
.tcard-head .nm { font-weight: 700; min-width: 0; word-break: break-word; }
.mini { background: var(--paper); color: var(--paper-ink); padding: 10px 12px; overflow-x: auto; border-top: 1px solid var(--line); max-height: 300px; overflow-y: auto; }
.mini table { border-collapse: collapse; font: .84rem Arial, sans-serif; }
.mini td, .mini th { border: 1px solid #C2CCD6; padding: 2px 7px; font-weight: 400; white-space: nowrap; text-align: center; }
.mini .h { background: #E9EEF3; }
.mini .l { text-align: left; }
.mini .hit { background: #FFE27A; font-weight: 700; outline: 2px solid #A87A00; outline-offset: -2px; }
.mini .chg { background: #FFE27A; font-weight: 700; }
.mini .chg.crossed { background: #F9C2D4; }
.mini .prob { background: #F9C2D4; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: .84rem; font-weight: 700; background: var(--surface2); color: var(--fg); }
.pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.info { background: var(--info-bg); color: var(--info); } .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.pink { background: var(--pink-soft); color: var(--pink-ink); }
.verdict { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; }
.verdict .ic { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface); }

.editor { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 10px 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tgroup { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tgroup > .gl { font-size: .76rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--pink-ink); margin-right: 3px; }
.tb { appearance: none; background: var(--surface2); color: var(--fg); border: 1.5px solid transparent; border-radius: 8px; padding: 4px 9px; font: 400 .88rem var(--body); cursor: pointer; min-height: 30px; }
.tb:hover:not([disabled]) { border-color: var(--green); }
.tb[disabled] { opacity: .42; cursor: not-allowed; }
.tb[aria-pressed="true"] { background: var(--green); color: var(--on-green); }
.deskwrap { background: var(--surface2); border-radius: 16px; padding: 18px; margin-top: 12px; overflow-x: auto;
  background-image: radial-gradient(var(--dot) 4px, transparent 4.5px); background-size: 22px 22px; }
.paper { background: var(--paper); color: var(--paper-ink); padding: 36px 40px; border-radius: 6px; box-shadow: 0 2px 10px rgba(11,36,71,.18); min-width: min-content; width: fit-content; max-width: none; min-height: 260px; margin-inline: auto; }
.paper table { border-collapse: collapse; }
.paper td { padding: .22em .55em; min-width: 2.4em; }
.paper [contenteditable] { outline: none; border-radius: 2px; min-width: 1ch; display: inline-block; }
.paper td:focus-within { box-shadow: inset 0 0 0 2px #0E7C66; }
.paper [contenteditable]:hover { background: rgba(14,124,102,.09); }
.paper [contenteditable]:focus { background: rgba(14,124,102,.14); }
.paper .blk { display: block; min-height: 1.2em; }
.paper [data-empty="1"]::before { content: attr(data-ph); color: #6A7A8A; font-style: italic; font-weight: 400; }
.paper .note-line { margin-top: .4em; }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
details.sec { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 2px 14px; }
details.sec[open] { padding-bottom: 14px; }
details.sec > summary { cursor: pointer; font-weight: 700; padding: 9px 0; list-style-position: inside; }
.sec-body { display: flex; flex-direction: column; gap: 11px; }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .94rem; }
.kv select { width: auto; flex: 0 1 60%; min-width: 0; padding: 4px 8px; }
.kv input[type=number] { width: 74px; padding: 4px 8px; }
.switch { display: flex; align-items: flex-start; gap: 9px; font-size: .94rem; cursor: pointer; }
.switch input { margin-top: 5px; width: 17px; height: 17px; accent-color: var(--green); flex: none; }
.swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 7px; }
.swatch { appearance: none; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); padding: 6px; cursor: pointer; font: 400 .82rem var(--body); display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
.swatch:hover { border-color: var(--green); }
.swatch i { display: block; height: 22px; border-radius: 5px; border: 1px solid rgba(0,0,0,.18); }
.title-in { font-size: 1.05rem; font-weight: 700; }
.lib { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
.issue { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); font-size: .96rem; }
.issue:first-child { border-top: 0; }
.issue .pill { flex: none; }
.change-list { list-style: none; padding: 0; margin: 0; }
.change-list li { padding: 6px 0; border-top: 1px solid var(--line); font-size: .95rem; word-break: break-word; }
.change-list li:first-child { border-top: 0; }
.ctab { font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--band); color: var(--band-fg); padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 30; box-shadow: 0 4px 16px rgba(0,0,0,.3); max-width: calc(100vw - 32px); text-align: center; }
.spin { display: inline-block; width: 15px; height: 15px; border-radius: 50%; border: 3px solid var(--mint); border-top-color: var(--green); }
@media (prefers-reduced-motion: no-preference) { .spin { animation: sp .8s linear infinite; } }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 1020px) { .editor { grid-template-columns: minmax(0, 1fr); } .toolbar { position: static; } }
@media (max-width: 820px) { .home { grid-template-columns: minmax(0, 1fr); } .brand h1 { font-size: 1.75rem; } h2 { font-size: 1.55rem; } .paper { padding: 20px 18px; } .panel { padding: 16px; } }

[hidden] { display: none !important; }
/* Next is always near the top */
.topnav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.choose-bar { display: flex; flex-direction: column; gap: 12px; padding: 12px 14px; position: sticky; top: 8px; z-index: 6; box-shadow: 0 4px 14px rgba(11,36,71,.1); }
.mode-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 8px; }
.mode-pick { appearance: none; text-align: left; font: inherit; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mode-pick:hover { border-color: var(--green); }
.mode-pick[aria-checked="true"] { border-color: var(--green); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--green); }
.pick-head { cursor: pointer; justify-content: flex-start; flex-wrap: nowrap; }
.pick-box { width: 20px; height: 20px; flex: none; accent-color: var(--green); margin: 0; }

.fmt-list { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
.fmt-item { appearance: none; display: flex; align-items: center; gap: 14px; text-align: left; font: inherit; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 13px 16px; cursor: pointer; }
.fmt-item:hover { border-color: var(--green); }
.fmt-item b { font-size: 1.08rem; }
.fmt-dot { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.fmt-item[aria-checked="true"] { border-color: var(--green); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--green); }
.fmt-item[aria-checked="true"] .fmt-dot { border: 6px solid var(--green); }

/* Build screen */
.build-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 10px 14px; position: sticky; top: 8px; z-index: 6; box-shadow: 0 4px 14px rgba(11,36,71,.1); }
.segs { display: inline-flex; background: var(--surface2); border-radius: 999px; padding: 3px; }
.seg { appearance: none; border: 0; background: transparent; color: var(--fg); font: 700 .98rem var(--body); padding: 7px 18px; border-radius: 999px; cursor: pointer; }
.seg[aria-selected="true"] { background: var(--green); color: var(--on-green); }
.builder { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.tray { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 4px; min-width: 0; }
.tray-top { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.tbox { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; flex: none; min-width: 0; }
.tbox-head { display: flex; align-items: center; gap: 9px; padding: 8px 12px; background: var(--surface2); user-select: none; -webkit-user-select: none; }
.tbox-head b { word-break: break-word; }
.src-dot { width: 13px; height: 13px; border-radius: 50%; flex: none; }
.grip { color: var(--muted); font-size: 1.15rem; }
.tgrab, .tcell, .grab { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.tray-mini { max-height: none; user-select: none; -webkit-user-select: none; }
.tray-mini td.tgrab:hover, .tray-mini td.tcell:hover { background: #BFE8D9; outline: 2px solid #0B6F5B; outline-offset: -2px; }
.tray-mini td.tgrab:focus-visible { outline: 3px solid #9A1F5B; outline-offset: -3px; }
.tray-mini td.used { background: #DDF3EA; }
.tray-mini td.used::after { content: " ✓"; color: #0B6F5B; font-weight: 700; }
.pal { display: inline-block; font-size: .86rem; padding: 3px 10px; border-radius: 999px; background: var(--pink-soft); color: var(--pink-ink); border: 1.5px solid var(--pink); }
.canvas { margin-top: 0; min-width: 0; }
.canvas-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: stretch; }
.zone { display: grid; place-items: center; border: 2px dashed var(--green); border-radius: 12px; color: var(--green); font-weight: 700; font-size: .86rem; background: rgba(255,255,255,.65); }
.zone[hidden] { display: none; }

  }

    h('div', {}, h('h2', { text: 'Compare & check' }), h('p', { class: 'muted', text: 'See what changed between runs, or catch anything off in a single output before someone else does.' })),

      C.files.length > 1 ? h('p', { class: 'hint', text: `Starting point: ${C.files[0].name}.` }) : null),

}
